name: Fix all number inputs

on:
  push:
    paths:
      - '.github/workflows/fix-all-number-inputs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fragile number inputs with buffered number input
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          needle = '<input className="input" type="number"'
          count = s.count(needle)
          if count == 0:
              raise SystemExit('No numeric inputs found to replace')
          s = s.replace(needle, '<NumberInput className="input"')

          marker = 'function Field({label,children}:{label:string;children:React.ReactNode})'
          helper = '''function NumberInput(props:React.InputHTMLAttributes<HTMLInputElement>){
  const {value,onChange,onFocus,onBlur,...rest}=props;
  const [draft,setDraft]=useState(value==null?'':String(value));
  const focused=useRef(false);
  useEffect(()=>{if(!focused.current)setDraft(value==null?'':String(value));},[value]);
  return <input {...rest} type="number" value={draft}
    onFocus={e=>{focused.current=true;onFocus?.(e);}}
    onChange={e=>{setDraft(e.target.value);if(e.target.value!=='')onChange?.(e);}}
    onBlur={e=>{focused.current=false;if(draft==='')setDraft(value==null?'':String(value));onBlur?.(e);}}/>;
}

'''
          if 'function NumberInput(' not in s:
              if marker not in s:
                  raise SystemExit('Field marker not found')
              s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          print(f'Replaced {count} number inputs')
          PY
          rm .github/workflows/fix-all-number-inputs.yml
      - name: Commit global number-input fix
        shell: bash
        run: |
          git config user.name "Leon OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix all numeric input editing"
          git push
