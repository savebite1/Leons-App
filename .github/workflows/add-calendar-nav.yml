name: Add calendar navigation

on:
  push:
    paths:
      - '.github/workflows/add-calendar-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible calendar navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          old_sidebar = "          <NavButton active={view==='plan'} icon=\"◇\" label=\"Plan\" onClick={()=>nav('plan')}/>\n          <NavButton active={view==='progress'} icon=\"↗\" label=\"Progress\" onClick={()=>nav('progress')}/>"
          new_sidebar = "          <NavButton active={view==='plan'} icon=\"◇\" label=\"Plan\" onClick={()=>nav('plan')}/>\n          <NavButton active={false} icon=\"▣\" label=\"Kalender\" onClick={()=>window.location.assign('/google-calendar')}/>\n          <NavButton active={view==='progress'} icon=\"↗\" label=\"Progress\" onClick={()=>nav('progress')}/>"
          if old_sidebar not in s:
              raise SystemExit('sidebar pattern not found')
          s = s.replace(old_sidebar, new_sidebar, 1)

          old_today = "      <button className=\"btn\" onClick={()=>openModal('profile',{type:'profile'})}>Einstellungen</button><button className=\"btn primary\" onClick={goOS}>Ask OS</button>"
          new_today = "      <button className=\"btn\" onClick={()=>window.location.assign('/google-calendar')}>Kalender</button><button className=\"btn\" onClick={()=>openModal('profile',{type:'profile'})}>Einstellungen</button><button className=\"btn primary\" onClick={goOS}>Ask OS</button>"
          if old_today not in s:
              raise SystemExit('today header pattern not found')
          s = s.replace(old_today, new_today, 1)

          old_plan = "  return <><Header eyebrow=\"PLAN\" title=\"Aufgaben & Kalender\"><button className=\"btn\" onClick={()=>openModal('event',{type:'event'})}>Termin +</button>"
          new_plan = "  return <><Header eyebrow=\"PLAN\" title=\"Aufgaben & Kalender\"><button className=\"btn\" onClick={()=>window.location.assign('/google-calendar')}>Google Kalender</button><button className=\"btn\" onClick={()=>openModal('event',{type:'event'})}>Termin +</button>"
          if old_plan not in s:
              raise SystemExit('plan header pattern not found')
          s = s.replace(old_plan, new_plan, 1)

          p.write_text(s)
          PY
          rm .github/workflows/add-calendar-nav.yml
      - name: Commit calendar navigation
        shell: bash
        run: |
          git config user.name "Leon OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add visible calendar navigation"
          git push
