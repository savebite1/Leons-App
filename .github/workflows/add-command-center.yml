name: Add command center

on:
  push:
    paths:
      - '.github/workflows/add-command-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Today command center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          import_line = "import type { AppState, Category, Exam, Goal, Habit, OsAction, Subject, Task, Workout } from './types';"
          if "from './signature'" not in s:
              if import_line not in s:
                  raise SystemExit('types import marker not found')
              s = s.replace(import_line, import_line + "\nimport { CommandCenter } from './signature';", 1)

          marker = "    </Header>\n    <div className=\"grid two\">"
          insertion = "    </Header>\n    <CommandCenter state={state} move={move} goOS={goOS}/>\n    <div className=\"grid two\">"
          if '<CommandCenter state={state} move={move} goOS={goOS}/>' not in s:
              if marker not in s:
                  raise SystemExit('Today header marker not found')
              s = s.replace(marker, insertion, 1)

          p.write_text(s)
          PY
          rm .github/workflows/add-command-center.yml
      - name: Commit command center integration
        shell: bash
        run: |
          git config user.name "Leon OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Leon OS command center"
          git push
